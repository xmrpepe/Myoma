# omamako default configuration (strftime syntax for clock/date formats)
[general]
theme = "tokyo-night"
terminal = ""
aur_helper = "auto"

[launcher]
font_size = 16
max_recents = 8
show_clock = true
layer_shell = true
clock_format = "%H:%M"
date_format = "%A, %d %B"

[hotkey]
mod = "SUPER"
key = "space"

[startup]
apps = []
